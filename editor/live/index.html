<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RAN Live Preview</title>
    <link rel="stylesheet" href="./livePreview.css">
  </head>
  <body>
    <main class="live-shell">
      <header class="live-header">
        <div>
          <h1>Live Preview</h1>
          <p id="statusText">waiting for simulation state</p>
        </div>
        <div class="header-tools">
          <button id="pauseButton" class="toolbar-button" type="button">Pause</button>
          <button id="exportButton" class="toolbar-button" type="button">Export Logs</button>
          <div id="coordinateText" class="coordinate-readout">x -, y -</div>
          <div id="agentSummary" class="agent-summary"></div>
        </div>
      </header>
      <section class="preview-surface">
        <canvas id="sceneCanvas" width="1200" height="820"></canvas>
        <aside class="console-panel">
          <div class="ran-panel">
            <div class="console-header">
              <span>Current RAN Tick</span>
              <span id="ranStatus">RAN input unknown</span>
            </div>
            <div id="ranSnapshot" class="ran-snapshot"></div>
          </div>
        </aside>
      </section>
      <section class="log-surface">
        <div class="runtime-panel">
          <div class="console-header">
            <span>Runtime Log</span>
            <span>scrolling history</span>
          </div>
          <div id="runtimeLog" class="console-log runtime-log"></div>
        </div>
      </section>
    </main>
    <script type="module" src="./livePreview.js"></script>
  </body>
</html>
