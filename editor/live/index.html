<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAN Simulation Preview</title>
<style>
  #chart-fallback { display: none; }
</style>
<script>
/* Chart.js 动态加载:多 CDN 备选,失败不阻塞页面其他渲染 */
(function () {
  var urls = [
    'https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js',
    'https://unpkg.com/chart.js@4/dist/chart.umd.min.js',
    'https://cdn.bootcdn.net/ajax/libs/Chart.js/4.4.1/chart.umd.min.js',
  ];
  var i = 0;
  function tryNext() {
    if (i >= urls.length) {
      window.CHART_OK = false;
      document.getElementById('chart-fallback').style.display = 'block';
      return;
    }
    var s = document.createElement('script');
    s.src = urls[i++];
    s.onload = function () { window.CHART_OK = true; };
    s.onerror = tryNext;
    document.head.appendChild(s);
  }
  tryNext();
})();
</script>
<link rel="stylesheet" href="livePreview.css?v=20260806b">
</head>
<body>

<header class="banner">
  <div class="title" data-i18n="overview.title">Simulation Overview</div>
  <div class="stat"><span data-i18n="overview.tick">tick</span> <b id="st-tick">0</b></div>
  <div class="stat" id="st-last-wrap" style="display:none"><span id="st-last"></span></div>
  <div class="stat"><span data-i18n="overview.agents">agents</span> <b id="st-agents">0</b></div>
  <div class="stat"><span data-i18n="overview.time">用时</span> <b id="st-time">0.0s</b></div>
  <div class="stat"><span data-i18n="overview.services">活跃服务</span> <b id="st-services">0</b></div>
  <div class="stat"><span data-i18n="overview.delivered">交付</span> <b id="st-delivered">0%</b></div>
  <div class="stat"><span class="status-dot running"></span><span id="st-status" data-i18n="overview.running">running</span></div>
  <div class="spacer"></div>
  <div id="banner-summary"></div>
  <button class="m3-btn tonal" id="btn-heatmap" data-i18n="map.heatmap">信道热力图</button>
  <button class="m3-btn tonal" id="btn-lang">EN</button>
  <button class="m3-btn tonal" id="btn-pause" data-i18n="overview.pause">暂停</button>
  <button class="m3-btn outlined" id="btn-export" data-i18n="overview.export">导出 Logs</button>
</header>

<div class="main">
  <section class="map-panel">
    <svg id="map" viewBox="0 0 2000 2000" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="map-hint" data-i18n="map.hint">悬停查看对象信息 · 浅色缺口 = 可通行</div>
    <div id="tooltip"></div>
    <div class="heatmap-legend">
      <span data-i18n="map.heatmap">信道热力图</span>
      <div class="bar"></div>
      <div class="labels"><span>-130 dBm</span><span>-60 dBm</span></div>
    </div>
  </section>

  <section class="right-top">
    <div class="task-panel" id="task-panel" style="display:none">
      <h4 data-i18n="task.panel">任务列表</h4>
      <div id="task-list"></div>
    </div>
    <div class="agent-cards" id="agent-cards"></div>
  </section>

  <section class="right-bottom">
    <div class="charts">
      <div class="chart-toolbar">
        <select id="chart-select" class="chart-select"></select>
      </div>
      <div class="chart-card chart-main-card">
        <canvas id="ch-main"></canvas>
        <div class="chart-empty" data-i18n="chart.waiting">等待 agent 到达目标并提交业务…</div>
      </div>
    </div>
  </section>
</div>

<script src="livePreview.js?v=20260806b"></script>
</body>
</html>
